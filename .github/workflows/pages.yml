name: deploy-help-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project site is published at the root (landing page) with the
      # multilingual guide under /help/. Internal technical documents stay in
      # the repo but off-site.
      - name: Build site
        run: |
          mkdir -p _site/assets
          cp docs/index.html _site/index.html
          cp -r docs/css _site/css
          cp -r docs/help _site/help
          cp assets/noesispdf-256.png _site/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
